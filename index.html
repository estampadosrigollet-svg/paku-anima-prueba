
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAKU | ANIMA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f7f5ef;
      color: #193c3d;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 410px;
      padding: 30px 24px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px #193c3d15;
    }
    h1 {
      margin: 0;
      font-size: 46px;
      letter-spacing: 3px;
      color: #176d70;
    }
    .subtitulo {
      margin: 3px 0 26px;
      color: #d47970;
      font-weight: bold;
      letter-spacing: 2px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font: inherit;
    }
    input {
      border: 1px solid #ccd7d4;
    }
    button {
      margin-top: 20px;
      border: 0;
      background: #176d70;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    #resultado {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #edf4f2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .nota {
      font-size: 12px;
      color: #657571;
      line-height: 1.5;
    }
    #salir { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>PAKU</h1>
    <div class="subtitulo">ANIMA · ACCESO INTERNO</div>

    <p>Verificación de identidad y autorización.</p>

    <form id="acceso">
      <label for="url">URL de tu proyecto Supabase</label>
      <input id="url" type="url"
        placeholder="https://proyecto.supabase.co"
        required>

      <label for="clave">Clave pública de Supabase</label>
      <input id="clave" type="text"
        placeholder="sb_publishable_..."
        autocomplete="off" required>

      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email"
        autocomplete="username" required>

      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password"
        autocomplete="current-password" required>

      <button id="entrar" type="submit">
        Verificar acceso
      </button>
    </form>

    <div id="resultado" role="status" aria-live="polite">
      Esperando inicio de sesión.
    </div>

    <button id="salir" type="button">
      Cerrar sesión
    </button>

    <p class="nota">
      Entorno de prueba PAKU V1.
      No utiliza claves secretas ni permite modificar datos.
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const formulario = document.getElementById("acceso");
    const resultado = document.getElementById("resultado");
    const boton = document.getElementById("entrar");
    const salir = document.getElementById("salir");

    let cliente = null;

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      boton.disabled = true;
      resultado.textContent = "Verificando identidad...";

      try {
        const url = document.getElementById("url").value.trim();
        const clave = document.getElementById("clave").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contrasena").value;

        if (!url.startsWith("https://") ||
            !url.includes(".supabase.co")) {
          throw new Error("Verifica la URL de Supabase.");
        }

        if (clave.startsWith("sb_secret_") ||
            clave.startsWith("eyJ") === false &&
            !clave.startsWith("sb_publishable_")) {
          throw new Error("Usa únicamente la clave pública.");
        }

        cliente = createClient(url, clave, {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
          }
        });

        const { data, error } =
          await cliente.auth.signInWithPassword({
            email: correo,
            password: contrasena
          });

        document.getElementById("contrasena").value = "";

        if (error) throw error;
        if (!data.user) {
          throw new Error("No se obtuvo una sesión válida.");
        }

        resultado.textContent =
          "Identidad autenticada. Verificando permisos...";

        const verificacion = await cliente.rpc(
          "paku_soy_administradora"
        );

        if (verificacion.error) {
          throw verificacion.error;
        }

        if (verificacion.data === true) {
          resultado.textContent =
            "AUTENTICACIÓN REAL: CORRECTA\n" +
            "AUTORIZACIÓN ANIMA: ADMINISTRADORA ACTIVA\n\n" +
            "Bienvenida a PAKU–ANIMA.";
        } else {
          resultado.textContent =
            "ACCESO DENEGADO:\n" +
            "La cuenta no tiene autorización activa.";
          await cliente.auth.signOut();
        }

        salir.style.display = "block";
      } catch (error) {
        resultado.textContent =
          "No se pudo verificar el acceso:\n" +
          error.message;
        if (cliente) await cliente.auth.signOut();
      } finally {
        boton.disabled = false;
      }
    });

    salir.addEventListener("click", async () => {
      if (cliente) await cliente.auth.signOut();
      salir.style.display = "none";
      resultado.textContent = "Sesión cerrada.";
    });
  </script>
</body>
</html>
