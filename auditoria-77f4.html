
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>PAKU · Auditoría 77F.4</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f6f3ed;
  color: #244344;
  padding: 20px;
}

main {
  max-width: 600px;
  margin: 20px auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
}

h1 { color: #197073; }

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd8d4;
  border-radius: 10px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  color: white;
  background: #197073;
  font-size: 16px;
  font-weight: bold;
}

#resultado {
  margin-top: 20px;
  padding: 17px;
  border-radius: 12px;
  background: #eaf3f0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

p { line-height: 1.6; }
</style>
</head>

<body>

<main>

<h1>PAKU · Auditoría</h1>

<h2>Paso 77F.4</h2>

<p>
Prueba real de acceso anónimo a ANIMA.
No inicia sesión ni modifica datos.
</p>

<label for="url">URL de Supabase</label>
<input
  id="url"
  type="url"
  placeholder="https://proyecto.supabase.co"
>

<label for="clave">Clave pública</label>
<input
  id="clave"
  type="text"
  placeholder="sb_publishable_..."
  autocomplete="off"
>

<button id="probar">
Probar acceso sin iniciar sesión
</button>

<div id="resultado">
Esperando prueba...
</div>

</main>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = id => document.getElementById(id);

$("probar").addEventListener("click", async () => {

  $("probar").disabled = true;

  $("resultado").textContent =
    "Intentando acceso anónimo...";

  try {

    const direccion = new URL(
      $("url").value.trim()
    );

    if (
      direccion.protocol !== "https:" ||
      !/^[a-z0-9-]+\.supabase\.co$/i.test(
        direccion.hostname
      ) ||
      direccion.pathname !== "/" ||
      direccion.search ||
      direccion.hash
    ) {
      throw new Error(
        "URL de Supabase no válida."
      );
    }

    const clave = $("clave").value.trim();

    if (!clave.startsWith("sb_publishable_")) {
      throw new Error(
        "Se requiere la clave pública."
      );
    }

    const cliente = createClient(
      direccion.origin,
      clave,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const { data, error } =
      await cliente.rpc(
        "paku_anima_simular_productos",
        {
          p_pakuid:
          "36937747-409e-425b-bb8e-b4412cfda83e"
        }
      );

    if (data !== null && data !== undefined) {

      $("resultado").textContent =
        "ALERTA DE SEGURIDAD\n\n" +
        "ANIMA devolvió información sin " +
        "una sesión autenticada.\n\n" +
        "No continuar hasta investigar.";

      return;
    }

    if (error) {

      const codigo = String(error.code || "");
      const estado = Number(error.status || 0);

      const rechazoConfirmado =
        codigo === "42501" ||
        estado === 401 ||
        estado === 403;

      $("resultado").textContent =
        (rechazoConfirmado
          ? "ACCESO ANÓNIMO RECHAZADO\n\n"
          : "PRUEBA NO CONCLUYENTE\n\n") +
        "Código: " + (codigo || "No informado") +
        "\nEstado HTTP: " +
        (estado || "No informado") +
        "\nMensaje: " + error.message;

      return;
    }

    $("resultado").textContent =
      "PRUEBA NO CONCLUYENTE.\n" +
      "No se recibió un resultado verificable.";

  } catch (error) {

    $("resultado").textContent =
      "PRUEBA NO CONCLUYENTE.\n\n" +
      "Error de conexión o configuración: " +
      error.message;

  } finally {

    $("probar").disabled = false;
    $("clave").value = "";

  }
});

</script>
</body>
</html>
